# secret.example.yaml — Plantilla de las variables que el backend espera vía
# el Secret "backend-secrets". NUNCA rellenar valores reales aquí ni
# commitear el resultado — este archivo documenta las KEYS, no los VALUES.
#
# Se crea una sola vez, a mano, en el clúster (no lo crea el pipeline):
#
#   kubectl create secret generic backend-secrets --namespace pruebas \
#     --from-literal=DB_USER=... \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=DB_SERVER=... \
#     --from-literal=DB_NAME=... \
#     --from-literal=API_KEY=... \
#     --from-literal=FRONTEND_URL=https://... \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=OPENROUTER_API_KEY=... \
#     --from-literal=GROQ_API_KEY=... \
#     --from-literal=AZURE_STORAGE_CONNECTION_STRING=... \
#     --from-literal=AZURE_STORAGE_CONTAINER=projectcsjdev
#
# Ver VARIABLES_DESPLIEGUE.md para cuáles son obligatorias y de dónde sacar
# cada valor real (backend/.env local).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: pruebas
type: Opaque
stringData:
  DB_USER: ""
  DB_PASSWORD: ""
  DB_SERVER: ""
  DB_NAME: ""
  API_KEY: ""
  FRONTEND_URL: ""
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GROQ_API_KEY: ""
  AZURE_STORAGE_CONNECTION_STRING: ""
  AZURE_STORAGE_CONTAINER: ""
