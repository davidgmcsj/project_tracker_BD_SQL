# deployment.yaml — Backend (Node/Express).
#
# replicas:1 + strategy:Recreate es OBLIGATORIO, no una elección de
# rendimiento: el backend escribe data.json/history.json a disco sin ningún
# bloqueo entre procesos. Un RollingUpdate corre brevemente el pod viejo y
# el nuevo a la vez → dos procesos escribiendo el mismo archivo →
# corrupción. Ver INFRAESTRUCTURA_Y_DESPLIEGUE.md §8 y
# GUIA_DESPLIEGUE_DOCKER.md §2. No escalar este Deployment sin antes migrar
# esa persistencia a SQL.
#
# __NAMESPACE__: sustituido por el pipeline (ver .github/workflows/deploy.yml)
# con el namespace real que confirme el equipo de infraestructura — NO copiar
# a mano un valor de otro proyecto (ej. pqrs-development pertenece a PQRS).
#
# containerPort 3002 (no 8080): a diferencia de pqrs-front/pqrs-api, que
# estandarizaron el puerto interno del contenedor a 8080, este backend Node
# escucha en 3002 en el propio código (server.cjs, variable PORT) — cambiar
# el puerto aquí sin cambiar el código dejaría el readinessProbe fallando y
# el pod en CrashLoopBackOff. Si infraestructura confirma que el clúster
# exige un puerto estándar, hay que cambiar AMBOS (código y manifiesto).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: __NAMESPACE__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracker-backend
  template:
    metadata:
      labels:
        app: tracker-backend
    spec:
      containers:
        - name: backend
          image: __ACR_LOGIN_SERVER__/project-tracker-backend:__TAG__
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            # Config no sensible (nada hoy, reservado para crecer) y
            # credenciales reales por separado — mismo patrón que
            # pqrs-back-development-configmap/-secret: reduce qué hay que
            # tratar como secreto de verdad. optional:true porque hoy el
            # ConfigMap está vacío (ver configmap.yaml) — si algún deploy
            # llegara a aplicarse sin él, el pod no debe quedar en
            # ContainerCreating por una referencia a un recurso sin datos.
            - configMapRef:
                name: backend-config
                optional: true
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # /healthz no consulta SQL a propósito (ver
          # backend/routes/diagnostics.routes.cjs) — un liveness probe no
          # debe depender de un recurso externo lento.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # HOME=/home fijado en backend/Dockerfile — data.json/history.json
            # quedan en /home/data (misma heurística que Azure App Service).
            - name: tracker-data
              mountPath: /home/data
            - name: tracker-archive
              mountPath: /app/archive
      volumes:
        - name: tracker-data
          persistentVolumeClaim:
            claimName: tracker-data
        - name: tracker-archive
          persistentVolumeClaim:
            claimName: tracker-archive
---
# Service ClusterIP: el backend NO se expone directo a internet, solo es
# visible dentro del clúster para el pod del frontend (que hace de proxy vía
# Nginx) — mismo criterio que docker-compose.yml (sin "ports" ahí).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: tracker-backend
  ports:
    - port: 3002
      targetPort: 3002
