# Solo el backend. Se conecta a "tracker-net", una red externa compartida
# con el docker-compose.yml del repo del FRONTEND (project_tracker_front) —
# así el frontend le habla a este contenedor por su nombre de servicio
# ("backend") sin que el puerto 3002 quede expuesto a internet.
#
# La red se crea UNA sola vez en el servidor, antes de levantar cualquiera
# de los dos:
#   docker network create tracker-net
#
# Luego, en cualquier orden:
#   docker compose up -d --build   (aquí, en project_tracker_backend/)
#   docker compose up -d --build   (en project_tracker_front/)

services:
  backend:
    build: .
    environment:
      NODE_ENV: production
      DB_SERVER: ${DB_SERVER}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_KEY: ${API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      # data.json + history.json (ver lib/json-store.cjs: con HOME=/home
      # fijado en el Dockerfile, el código ya sabe escribir aquí).
      - tracker-data:/home/data
      # Cierres trimestrales (routes/quarters.routes.cjs) — carpeta DISTINTA
      # de la anterior, no se puede fusionar.
      - tracker-archive:/app/archive
    networks:
      - tracker-net
    restart: unless-stopped
    # Sin "ports": nadie fuera de tracker-net llega directo al backend. Todo
    # el tráfico externo entra por Nginx, en el repo del frontend.

networks:
  tracker-net:
    external: true

volumes:
  tracker-data:
  tracker-archive:
