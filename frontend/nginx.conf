# Nginx sirve el SPA compilado, termina TLS y hace de proxy interno hacia
# el backend.
#
# Por qué proxy en vez de llamar al backend directo desde el navegador:
# así frontend y backend quedan bajo el MISMO origen (misma IP/puerto tal
# como lo ve el navegador). Elimina CORS entre orígenes distintos y evita
# tener que exponer el puerto 3002 del backend al exterior.
#
# Por qué HTTPS es obligatorio aquí (no opcional): la cookie de sesión se
# crea con secure:true cuando NODE_ENV=production (backend/routes/auth.routes.cjs).
# Un navegador descarta cookies "secure" si la página no se sirve por HTTPS —
# sin este bloque, el login parece funcionar pero la sesión no se guarda.

server {
    listen 80;
    server_name _;
    # Redirige todo a HTTPS. Certificado esperado en /etc/nginx/certs/
    # (ver GUIA_DESPLIEGUE_DOCKER.md para generarlo).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (React Router decide qué mostrar del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
