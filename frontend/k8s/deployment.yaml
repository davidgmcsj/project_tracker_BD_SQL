# deployment.yaml — Frontend (SPA compilado + Nginx).
#
# Stateless: Nginx solo sirve archivos estáticos y hace de proxy hacia el
# Service "backend" (ver nginx.conf: proxy_pass http://backend:3002). Sin
# variables de entorno en runtime — VITE_API_KEY ya quedó incrustada en el
# JavaScript compilado en build time (ver .github/workflows/deploy.yml).
#
# __NAMESPACE__: ver nota en backend/k8s/deployment.yaml — sustituido por el
# pipeline, confirmar el valor real con infraestructura.
#
# Puertos 80/443 con TLS servido DESDE el pod (certs montados vía Secret
# frontend-tls-certs): distinto del patrón de pqrs-front, que expone 8080
# sin TLS propio porque el LoadBalancer interno de Azure ya lo hace público
# solo dentro de la red corporativa (annotation
# azure-load-balancer-internal) y aparentemente no termina TLS en el pod. Si
# infraestructura confirma que nuestro AKS también maneja TLS por fuera del
# pod (ingress/gateway), este Deployment podría simplificarse a un solo
# puerto 8080 sin certs — no se asume aquí porque cambiaría nginx.conf y el
# Dockerfile, no solo este manifiesto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracker-frontend
  template:
    metadata:
      labels:
        app: tracker-frontend
    spec:
      containers:
        - name: frontend
          image: __ACR_LOGIN_SERVER__/project-tracker-frontend:__TAG__
          ports:
            - containerPort: 80
            - containerPort: 443
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: tls-certs
          secret:
            secretName: frontend-tls-certs
---
# Service LoadBalancer: única pieza expuesta a internet — el backend queda
# detrás, solo alcanzable dentro del clúster (ver backend/k8s/deployment.yaml).
# Si infraestructura indica que este frontend también debe ser solo interno
# (no público), agregar aquí la misma annotation que usa pqrs-front:
#   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: __NAMESPACE__
spec:
  type: LoadBalancer
  selector:
    app: tracker-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
