# secret.example.yaml — Plantilla del Secret "frontend-tls-certs".
#
# Genérico (Opaque), NO tipo "kubernetes.io/tls": nginx.conf monta los dos
# archivos por nombre exacto (fullchain.pem/privkey.pem) igual que el bind
# mount ./certs de docker-compose.yml — un Secret tipo "tls" usa las keys
# fijas tls.crt/tls.key, que no coinciden con lo que nginx.conf espera.
#
# Se crea una sola vez, a mano, en el clúster (no lo crea el pipeline) —
# sustituir <namespace> por el que confirme infraestructura:
#
#   kubectl create secret generic frontend-tls-certs --namespace <namespace> \
#     --from-file=certs/fullchain.pem --from-file=certs/privkey.pem
#
# Ver GUIA_DESPLIEGUE_DOCKER.md §1.3 para generar un certificado autofirmado.
apiVersion: v1
kind: Secret
metadata:
  name: frontend-tls-certs
  namespace: __NAMESPACE__
type: Opaque
stringData:
  fullchain.pem: ""
  privkey.pem: ""
